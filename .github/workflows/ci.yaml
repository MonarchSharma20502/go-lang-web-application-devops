name: Go CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'helm/**'

jobs: # Multiple Jobs can be run in parallel. However they can also be run sequentially by using the needs keyword (used below later).
  build: # ID of this Job is "build". This is used later on in the needs keyword of other Jobs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository # This is just a label used to describe the step. It can be anything of our choice.
        uses: actions/checkout@v4 # This is an action provided by the community to check out the repository. WITHOUT THIS, THE VM WILL HAVE NO SOURCE CODE (It performs git clone internally)

      - name: Set up Go # This is just a label used to describe the step.
        uses: actions/setup-go@v2 # This installs Go in the runner (doesn't gaurantee correct version).
        with: # This adds constraint or input parameters to the action to go with the specific version.
          go-version: 1.22
          cache: true # Cache stores '~/go/pkg/mod' Downloads are skipped if dependencies haven't changed.

      - name: Install dependencies
        run: go mod download  # Shell command to download every dependency described in go.mod file.

      - name: Build Go Application
        run: go build -o go-web-app  # Shell command to build the go application (-o defines the output filename {custom}).

      - name: Run Tests
        run: go test ./... # Shell command to run the test on the application and check if they are passing or not (It checks every package or folder inside the project for testing because we used "./...").

  code-quality: # ID of this Job is "code-quality". This is used later on in the needs keyword of other Jobs.
    name: Run Code Quality Check
    runs-on: ubuntu-latest  # Another Runner for new Job (can run in Parallel with previous jobs).
    steps:
      - name: Checkout repository # Required step so that the new runner has the code to work with.
        uses: actions/checkout@v4

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6  # It checks formatting, unused variables, bad practices, possible bugs, inefficient code.
        with:
          version: v1.56.2  # Uses specific version of the golangci-lint tool

  push:  # New Job for pushing the Code to Docker Hub Repsository.
    runs-on: ubuntu-latest

    needs: build  # This is the ID of the first Job "build" referenced here (it will be executed after the build Job is completed)

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v1 # The build-push action requires buildx to be available.

    - name: Login to DockerHub
      uses: docker/login-action@v3
      with:
      # ${{ }} means to evaluate the expression inside it. secrets.
        username: ${{ secrets.DOCKERHUB_USERNAME }} # DOCKERHUB_USERNAME is a secret defined in the GitHub repository.
        password: ${{ secrets.DOCKERHUB_TOKEN }} # secrets.DOCKERHUB_TOKEN is a secret defined in the GitHub repository.
    
    - name: Build and Push action
      uses: docker/build-push-action@v6 # Internally performs "docker build -t image ." and then "docker push image".
      with:
        context: .  # . specifies to use this folder as the Docker build context.
        file: ./Dockerfile # Specifies the Dockerfile to use.
        push: true # Specifies to push the image to the Docker Hub repository after building the code.
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/go-web-app:${{github.run_id}}
      
  update-newtag-in-helm-chart:
    runs-on: ubuntu-latest

    needs: push # This stage only works when the above stage completes successfully (i.e., new tag is generated).

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.TOKEN }} # We must create a Secret on GitHub for PAT Token (To authenticate for pushing the code to the GitHub Repository)
      # The default "GITHUB_TOKEN" often has read permissions, but we need write permissions to push the code to the repository.
    - name: Update tag in Helm chart
      run: |
        sed -i 's/tag: .* /tag: "${{github.run_id}}"/' helm/go-web-app-chart/values.yaml
      # This changes the tag in images in the values.yaml with the new run id.

      # This below code again pushes the updated values.yaml file to the same repo with latest changes.
    - name: Commit and push changes
      run: |
        git config --global user.email "monarchsharma.m20@gmail.com"
        git config --global user.name "Monarch Sharma"
        git add helm/go-web-app-chart/values.yaml
        git commit -m "Update tag in Helm chart"
        git push