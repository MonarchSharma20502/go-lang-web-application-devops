# IN A NUTSHELL, THE VALUES.YAML IS A FILE WITH ACTUAL VALUES WHERE OTHER YAML FILES REFER THESE VALUES FROM HERE. THIS IS SIMILAR TO HOW VARIABLES WORK IN PROGRAMMING.

# Default values for go-web-app helm-chart
# Declare variables to be passed into templates.

replicaCount: 1

image:
  repository: monarchsharma/go-lang-web-application-devops
  pullPolicy: IfNotPresent
  tag: "v1"
  
ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
  - host: chart-example.local
    paths:
    - path: /
      pathType: ImplementationSpecific